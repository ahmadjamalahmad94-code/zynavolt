name: solardeye_mobile
description: "SolarDeye mobile client - Arabic RTL Flutter app driven by /api/mobile/* backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP client. Chosen over `http` because we need: request/response
  # interceptors (Bearer attach + 401 refresh), per-request timeouts,
  # multipart support later, and structured DioException objects to map
  # cleanly onto our ApiException model. The plain `http` package would
  # need a hand-rolled wrapper for all of that.
  dio: ^5.7.0

  # Secure storage for access + refresh tokens (Android Keystore).
  flutter_secure_storage: ^9.2.2

  # Declarative routing so notification deep-links can map onto screens
  # later without rewriting the navigator.
  go_router: ^14.6.1

  # v69: support attachments. The mobile-side flow is:
  #   1. Fetch the attachment bytes through the existing Dio client
  #      (bearer-token route — cannot be hit by a plain external
  #      browser without the Authorization header).
  #   2. Write the bytes into a per-app temporary file.
  #   3. Hand off to the OS viewer so PDFs / images / Office docs
  #      open in their native app instead of the user being stuck
  #      with a downloaded blob.
  # `path_provider` gives us the app-cache directory cross-platform.
  # `open_filex` is the maintained successor to `open_file`/`open_file_plus`.
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # v72: support attachment upload. The mobile-side flow opens the
  # OS picker (documents + images), captures `PlatformFile.path` /
  # `name` / `size`, then hands the files to a new
  # `ApiClient.postMultipart(...)` helper for the v71 upload routes.
  # `file_picker` is the standard maintained picker and supports
  # multi-file selection in one tap — required by the backend's
  # multi-file `attachments` field. Camera capture is intentionally
  # NOT in phase-1 (would add `image_picker` + permission plumbing).
  file_picker: ^8.1.4

  # v77: line/area charts for the Home advanced energy visualization
  # section. `fl_chart` is the de-facto Flutter charting package — well
  # maintained, premium visual quality, native CustomPainter (no JS /
  # web view), supports overlaid line series, smooth Bezier curves,
  # area fills, custom tooltips, and RTL-friendly axis labeling. We
  # use it only inside the new `features/charts/...` module; no other
  # screen pulls it in, so the dependency stays scoped.
  fl_chart: ^0.69.2

  # v91 — open Stripe-hosted Checkout URLs in the OS browser.
  # The mobile plan-change flow returns a `url` from
  # `/api/mobile/account/plan-change/checkout`; this package launches
  # it in Chrome / Safari / the system browser and brings the user
  # back to the app on completion (success / cancel deep-link or
  # plain "return to app" gesture).
  url_launcher: ^6.3.1
  # v100-fonts (TEMPORARY): runtime Arabic-font A/B testing.
  # `google_fonts` fetches fonts on first use and caches them on
  # disk, so previewing Cairo / Tajawal / Almarai / IBM Plex /
  # Readex / Noto Arabic / El Messiri doesn't bloat the APK.
  # After the owner picks a winner we either bundle that single
  # font as an asset (and drop this dep) or keep `google_fonts`
  # for the chosen font alone. The Settings → نوع الخط card and
  # AppFontPref enum / provider should be removed alongside this
  # dependency when the trial is over.
  google_fonts: ^6.2.1

  # v101 — Firebase Cloud Messaging for push notifications.
  # `firebase_core` initializes the SDK from the google-services.json
  # baked into android/app/. `firebase_messaging` registers the device
  # for FCM, hands us the per-install token, and surfaces incoming
  # messages via Riverpod-friendly streams.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # v100-icons — generates the Android launcher icons (mipmap-*/
  # ic_launcher.png + adaptive variants) from a single source PNG.
  # Run `flutter pub get && dart run flutter_launcher_icons` after
  # changing the source asset to regenerate every density bucket.
  flutter_launcher_icons: ^0.14.4

# v100-icons — flutter_launcher_icons config. The source PNG must
# be 1024×1024 with transparent or matte background. Adaptive icon
# uses a navy fill behind the foreground glyph so older devices
# show a clean rounded square instead of a transparent crop.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/zynavolt_app_icon.png"
  adaptive_icon_background: "#0E1A2E"
  adaptive_icon_foreground: "assets/branding/zynavolt_app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  # v95: real Arabic font integration. Each weight ships as its own .ttf
  # so Flutter resolves `fontWeight: FontWeight.wXXX` straight to the
  # matching cut without interpolating from a variable font.
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Thin.ttf
          weight: 100
        - asset: assets/fonts/Alexandria-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Alexandria-Light.ttf
          weight: 300
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
        - asset: assets/fonts/Alexandria-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Alexandria-Black.ttf
          weight: 900
